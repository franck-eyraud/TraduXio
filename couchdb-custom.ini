[vhosts]
traduxio.domain.cdn = /traduxio/_design/traduxio/_rewrite

[couchdb]
os_process_timeout = 30000

[native_query_servers]
erlang = {couch_native_process, start_link, []}

[httpd]
authentication_handlers = {couch_httpd_auth, proxy_authentication_handler}, {couch_httpd_auth, cookie_authentication_handler}, {couch_httpd_auth, default_authentication_handler}
changes_timeout = 29500

[replicator]
max_replication_retry_count = 50

[query_server_config]
os_process_limit = 40

